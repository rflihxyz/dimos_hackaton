[tool.poetry]
name = "api"
version = "0.1.0"
description = "Backend API"
authors = ["Rachid F <rachid@getpanora.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = "^0.35.0"
pydantic = {extras = ["email"], version = "^2.11.5"}
python-multipart = ">=0.0.26,<1.0.0"
fastapi-pagination = "^0.13.3"
structlog = "^25.5.0"
httpx = "^0.28.1"
httpx-sse = "^0.4.0"
pydantic-ai = "^1.103.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
aiofiles = "^24.1.0"
exa-py = "^2.13.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# passlib 1.7.x is incompatible with bcrypt >= 4.1 (it reads bcrypt.__about__
# which was removed). Pin below 4.1 — same workaround as the logistics repo.
bcrypt = "<4.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
